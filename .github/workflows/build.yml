on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download
        run: aria2c --input-file=url.txt --conf-path=aria2.conf

      - name: Extract
        run: |
          cd download
          7z x -t# chipset.exe -ochipset '*ChipsetInstaller.exe'

          cd chipset
          installer=$(ls | head -n 1)
          7z x -t# "$installer" -oinstaller '*.zip'

          cd installer
          7z x *.zip
          mv Drivers chipset

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          path: download/chipset/installer/chipset
          compression-level: 9
