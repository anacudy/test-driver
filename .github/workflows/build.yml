on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare
        run: |
          dpkg -s msitools
          sudo apt -qq update
          sudo apt -qq install -y msitools

      - name: Download
        run: |
          mkdir driver
          aria2c --input-file=url.txt --conf-path=aria2.conf

      - name: Chipset
        run: |
          7z x -t# chipset.exe -ochipset *ChipsetInstaller.exe
          7z x -t# chipset/$(ls chipset | head -n 1) -ochipset *.zip
          unzip -d chipset chipset/*.zip || [[ $? -eq 1 ]]
          mv chipset/Drivers driver/chipset

      - name: Graphics
        run: |
          7z x 7th-10th_gfx.exe -o7th-10th_gfx
          7z x 11th-14th_gfx.exe -o11th-14th_gfx
          mv 7th-10th_gfx/Graphics driver/7th-10th_gfx
          mv 11th-14th_gfx/Graphics driver/11th-14th_gfx

      - name: Bluetooth
        run: |
          7z x -t# ac_bt.exe -oac_bt *.msi
          7z x -t# be_bt.exe -obe_bt *.msi
          msiextract -C ac_bt ac_bt/*.msi
          msiextract -C be_bt be_bt/*.msi
          mv 'ac_bt/Program Files/Intel/Bluetooth/drivers' driver/ac_bt
          mv 'be_bt/Program Files/Intel/Bluetooth/drivers' driver/be_bt

      - name: 7z
        run: 7z a -t7z -mx=9 -m0=lzma2 -md=256m -mfb=273 -ms=on driver.7z driver

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          files: driver.7z
          overwrite_files: true
          fail_on_unmatched_files: true
